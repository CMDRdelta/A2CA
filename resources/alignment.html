<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2CA – Alignment</title>
<link rel="stylesheet" href="styles.css?v=2.0.44">
</head>
<body>
<nav>
  <a href="upload.html" target="_top">Start</a>
  <a href="analysis.html">Analysis</a>
  <a class="current" href="alignment.html">Alignment</a>
  <div class="steps"><span class="step">1 Input</span><span class="step active">2 Analysis</span></div>
</nav>
<div class="container">
  <div id="missingData" class="card warn" hidden>
    <h2>No alignment found</h2>
    <p>Load an alignment and phylogenetic tree on the upload page first.</p>
    <a class="button-link" href="upload.html" target="_top">Go to input</a>
  </div>

  <div id="alignmentApp" hidden>
    <section class="card">
      <div class="page-header-row">
        <div>
          <h1>Sequence alignment</h1>
          <p id="alignmentSummary" class="muted"></p>
        </div>
        <div class="actions" style="margin-top:0">
          <button id="downloadAlignmentBtn" type="button">Download alignment</button>
          <a id="alignmentBackBtn" class="button-link secondary" href="analysis.html">Back to analysis</a>
        </div>
      </div>
      <div id="alignmentView" class="alignment-view"></div>
    </section>
  </div>
</div>
<script src="a2ca-core.js?v=2.0.44"></script>
<script src="alignment.js?v=2.0.44"></script>
</body>
</html>
