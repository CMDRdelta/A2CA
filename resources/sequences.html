<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2CA – BLAST sequences</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav>
  <a href="upload.html" target="_top">Start</a>
  <a id="sequenceInputNav" href="upload_single.html">Input</a>
  <a class="current" href="sequences.html">Sequences</a>
  <div class="steps"><span class="step active">1 Input</span><span class="step">2 Alignment</span><span class="step">3 Analysis</span></div>
</nav>
<div class="container">
  <div id="missingData" class="card warn" hidden>
    <h2>No BLAST sequences found</h2>
    <p>Run an NCBI BLAST search and retrieve the homolog sequences first.</p>
    <a id="sequenceMissingBackBtn" class="button-link" href="upload_single.html">Back to BLAST</a>
  </div>

  <div id="sequenceApp" hidden>
    <section class="card">
      <div class="page-header-row">
        <div>
          <h1>Retrieved BLAST sequences</h1>
          <p id="sequenceSummary" class="muted"></p>
        </div>
        <div class="actions" style="margin-top:0">
          <button id="downloadSequencesBtn" type="button">Download sequences</button>
          <a id="sequenceBackBtn" class="button-link secondary" href="upload_single.html">Back to BLAST</a>
        </div>
      </div>
      <div id="sequenceView" class="alignment-view"></div>
    </section>
  </div>
</div>
<script src="a2ca-core.js"></script>
<script src="sequences.js"></script>
</body>
</html>
