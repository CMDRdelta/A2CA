<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2CA – Phylogenetic tree</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav>
  <a href="upload.html" target="_top">Start</a>
  <a href="analysis.html">Analysis</a>
  <a class="current" href="tree.html">Tree</a>
  <div class="steps"><span class="step">1 Input</span><span class="step active">Tree view</span></div>
</nav>
<div class="container tree-view-container">
  <div id="missingData" class="card warn" hidden>
    <h2>No phylogenetic tree found</h2>
    <p>Load or construct a phylogenetic tree first.</p>
    <a class="button-link" href="upload.html" target="_top">Go to input</a>
  </div>

  <div id="treeApp" hidden>
    <section class="card">
      <div class="page-header-row">
        <div>
          <h1>Phylogenetic tree</h1>
          <p id="treeSummary" class="muted"></p>
        </div>
        <div class="actions" style="margin-top:0">
          <button id="downloadTreeBtn" type="button">Download tree</button>
          <a id="treeBackBtn" class="button-link secondary" href="analysis.html">Back to analysis</a>
        </div>
      </div>
      <div id="treeView" class="plotbox standalone-tree-view"></div>
    </section>
  </div>
</div>
<script src="a2ca-core.js"></script>
<script src="tree.js"></script>
</body>
</html>
