name: Validate A2CA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MAFFT
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mafft
          command -v mafft
          mafft --version

      - name: Validate repository
        run: python tools/validate_repo.py

      - name: Smoke-test web server
        shell: bash
        run: |
          set -euo pipefail
          PORT=8765 python main.py > /tmp/a2ca-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          READY=0
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8765/health >/dev/null; then
              READY=1
              break
            fi
            sleep 0.25
          done

          if [ "$READY" -ne 1 ]; then
            echo "A2CA health check did not become ready."
            echo "--- MAFFT ---"
            command -v mafft || true
            mafft --version || true
            echo "--- Server log ---"
            cat /tmp/a2ca-server.log || true
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8765/health | grep -q '^ok$'
          curl --fail --silent --location http://127.0.0.1:8765/ | grep -q "Amino Acid Cluster Analysis"
